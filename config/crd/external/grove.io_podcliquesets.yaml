# ⚠ TEST-ONLY CRD. ⚠ Do NOT apply to a real cluster; the Grove operator
# installs the real one. Minimal PodCliqueSet (grove.io/v1alpha1) so envtest can
# build the Grove ownership chains of Design 005 (DynamoGraphDeployment →
# PodCliqueSet → [PodCliqueScalingGroup →] PodClique → Pod). k8s-aibom
# reads only metadata (ownerReferences, uid) from Grove kinds; the spec
# is preserved unvalidated. Shape per ai-dynamo/grove @78231d7.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: podcliquesets.grove.io
  annotations:
    api-approved.kubernetes.io: "unapproved, k8s-aibom test fixture (minimal subset)"
spec:
  group: grove.io
  scope: Namespaced
  names:
    plural: podcliquesets
    singular: podcliqueset
    kind: PodCliqueSet
    listKind: PodCliqueSetList
    shortNames:
      - pcs
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true

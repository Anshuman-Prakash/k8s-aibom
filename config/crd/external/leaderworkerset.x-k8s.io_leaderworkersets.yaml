# ⚠ TEST-ONLY CRD. ⚠
#
# Real clusters install kubernetes-sigs/lws's full CRD via its manifests
# or Helm chart. This minimal version exists solely so envtest can
# validate LeaderWorkerSet creation against a schema scoped to the
# fields k8s-aibom extracts. Do NOT apply this file to a real cluster.
#
# The fields this CRD explicitly schemas are (Design 003 §2):
#   - spec.leaderWorkerTemplate.leaderTemplate   (PodTemplateSpec, optional)
#   - spec.leaderWorkerTemplate.workerTemplate   (PodTemplateSpec, required upstream)
#   - spec.leaderWorkerTemplate.size
#   - spec.replicas
#
# Everything else is permitted via x-kubernetes-preserve-unknown-fields.
# v1 is the only served version; the controller is pinned to it — see
# docs/external-crd-versions.md.

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: leaderworkersets.leaderworkerset.x-k8s.io
  annotations:
    api-approved.kubernetes.io: "unapproved, k8s-aibom test fixture (minimal subset)"
spec:
  group: leaderworkerset.x-k8s.io
  scope: Namespaced
  names:
    plural: leaderworkersets
    singular: leaderworkerset
    kind: LeaderWorkerSet
    listKind: LeaderWorkerSetList
    shortNames:
      - lws
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              required:
                - leaderWorkerTemplate
              properties:
                replicas:
                  type: integer
                  format: int32
                leaderWorkerTemplate:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  required:
                    - workerTemplate
                  properties:
                    size:
                      type: integer
                      format: int32
                    leaderTemplate:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    workerTemplate:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true

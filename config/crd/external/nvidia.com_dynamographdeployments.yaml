# ⚠ TEST-ONLY CRD. ⚠
#
# Real clusters install the NVIDIA Dynamo operator's full CRD via the
# dynamo-platform Helm chart. This minimal version exists solely so
# envtest can validate DynamoGraphDeployment creation against a schema
# scoped to the fields k8s-aibom extracts. Do NOT apply this file to a
# real cluster — it will conflict with the real CRD and strip fields
# the operator expects.
#
# The fields this CRD explicitly schemas are (Design 003 §4):
#   - spec.backendFramework              (enum: sglang | vllm | trtllm)
#   - spec.components[].name
#   - spec.components[].type             (enum: frontend | worker | prefill |
#                                         decode | planner | epp | lpx)
#   - spec.components[].modelRef.{name,revision}
#   - spec.components[].podTemplate      (PodTemplateSpec; shape preserved)
#   - spec.components[].roles[].{name,podTemplate}
#   - spec.components[].multinode.nodeCount
#
# Everything else is permitted via x-kubernetes-preserve-unknown-fields.
# Only v1beta1 is served here. The real CRD (dynamo-platform 1.2–1.4)
# also serves v1alpha1 — deprecated but still the STORAGE version — with
# Webhook conversion served by the Dynamo operator; the controller reads
# v1beta1 only and lets the API server convert. The failed-conversion
# fixture lives with #127. See docs/external-crd-versions.md.

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dynamographdeployments.nvidia.com
  annotations:
    api-approved.kubernetes.io: "unapproved, k8s-aibom test fixture (minimal subset)"
spec:
  group: nvidia.com
  scope: Namespaced
  names:
    plural: dynamographdeployments
    singular: dynamographdeployment
    kind: DynamoGraphDeployment
    listKind: DynamoGraphDeploymentList
    shortNames:
      - dgd
  versions:
    - name: v1beta1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                backendFramework:
                  type: string
                  enum:
                    - sglang
                    - vllm
                    - trtllm
                components:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        maxLength: 253
                      type:
                        type: string
                        enum:
                          - frontend
                          - worker
                          - prefill
                          - decode
                          - planner
                          - epp
                          - lpx
                      modelRef:
                        type: object
                        required:
                          - name
                        properties:
                          name:
                            type: string
                            maxLength: 2048
                          revision:
                            type: string
                            maxLength: 253
                      podTemplate:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      multinode:
                        type: object
                        properties:
                          nodeCount:
                            type: integer
                            format: int32
                      roles:
                        type: array
                        items:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                          required:
                            - name
                          properties:
                            name:
                              type: string
                              maxLength: 253
                            podTemplate:
                              type: object
                              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true

name: Terraform E2E Test

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'charts/**'
      - 'Dockerfile'
      - 'Makefile'

# Default token scope for every job; jobs that need more declare it.
permissions:
  contents: read

jobs:
  terratest:
    if: vars.GCP_WIF_PROVIDER && vars.GCP_SERVICE_ACCOUNT
    runs-on: ubuntu-latest
    permissions:
      id-token: write 
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
        with:
          install_components: 'gke-gcloud-auth-plugin'

      - name: Authenticate Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Fetch GKE Credentials
        env:
          CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
          CLUSTER_LOCATION: ${{ vars.GKE_CLUSTER_LOCATION }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          gcloud container clusters get-credentials "$CLUSTER_NAME" \
            --location "$CLUSTER_LOCATION" \
            --project "$PROJECT_ID"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.22'

      - name: Run Terratest
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
          GKE_CLUSTER_LOCATION: ${{ vars.GKE_CLUSTER_LOCATION }}
        working-directory: terraform/test
        run: |
          go mod tidy
          go test -v -timeout 45m ./...

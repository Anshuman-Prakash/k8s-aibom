# This chart has no configurable values. It renders the two k8s-aibom
# CRDs verbatim from the controller's generated manifests, each carrying
# helm.sh/resource-policy: keep so that uninstalling the chart never
# deletes the CRDs (and with them every AIBOM in the cluster). To purge:
#   kubectl delete crd aiboms.aibom.k8saibom.dev aibomcontrollerconfigs.aibom.k8saibom.dev
{}
